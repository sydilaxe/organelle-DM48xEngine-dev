# Release build: rebuild the patches and manual from source, test them in Pure Data, package the zips.
#  - Push a tag like v1.0  -> a GitHub Release with the zips and the manual attached.
#  - Actions tab > "Release build" > Run workflow  -> the same build, zips kept as a workflow artifact;
#    tick "publish" to also create the tag (e.g. v1.0) and the GitHub Release from that run.
#  - A release drafted on GitHub's Releases page creates its tag, which runs this too: the zips are attached to it.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v1.0 (also the tag name when publishing)"
        default: "dev"
      publish:
        description: "Publish a GitHub Release (creates the tag at this commit)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Pure Data and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends puredata-core python3-numpy zip
          pd -version

      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="${{ inputs.version || 'dev' }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build DM48 Engine and its manual
        working-directory: tools/dm48-engine
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log || { tail -n 25 build.log | sed 's/^/::error::/'; exit 1; }

      - name: Committed patch matches its source
        run: |
          if ! git diff --quiet -- patches/; then
            git status --short -- patches/
            echo "::error::patches/ is out of date - run tools/dm48-engine/build.sh and commit the result"
            exit 1
          fi

      - name: Test in Pure Data
        working-directory: tools/dm48-engine
        run: |
          set -o pipefail
          python3 gen_all.py "../DM48 Engine"
          ./tload.sh "../DM48 Engine"
          python3 ci_check.py "../DM48 Engine" 2>&1 | tee check.log || { grep -E "FAIL|Error|error|Traceback" check.log | tail -n 25 | sed 's/^/::error::/'; exit 1; }

      - name: Package
        run: tools/package.sh "${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: organelle-patches-${{ steps.v.outputs.version }}
          path: dist/

      - name: Publish the release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          cat > notes.md <<EOF
          ## Install
          Unzip and copy the folder(s) into the Organelle's **Patches** folder (USB stick, SD card, or the OS 5 web editor).

          - **DM48_Engine-$v.zip**: the DM48 Engine patch (breath synth host, MIDI and audio loopers, DM48X tuning library)
          - **DM48_Engine_Manual-$v.pdf**: the manual

          Built from source and tested offline in Pure Data by the release workflow.
          EOF
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" dist/* --clobber
          else
            gh release create "$v" dist/* --target "$GITHUB_SHA" --title "Organelle patches $v" --notes-file notes.md --generate-notes
          fi
